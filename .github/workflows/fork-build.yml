name: fork-macos-build

on:
  workflow_dispatch:
  push:
    branches: [pane-titlebars]

jobs:
  build:
    # macos-26 host: Xcode 26.x asset tools (actool/ibtool) crash on a
    # macOS 15 host, and the app build needs Xcode 26. Xcode 26.2 is pinned
    # for everything: it's what upstream CI uses, and its SDK predates the
    # Xcode 26.4 __availability_version_check regression that breaks
    # Zig 0.15 linking (ziglang/zig#31658).
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Plain Zig install instead of the nix devshell: Zig inside nix on a
      # GitHub-hosted macOS runner cannot link the build runner against
      # libSystem; a plain Zig finds the Apple SDK via xcrun.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      # GhosttyKit is the framework that is built from Zig for the native
      # Mac app.
      - name: Build GhosttyKit
        run: zig build -Doptimize=ReleaseFast -Demit-macos-app=false

      # Must NOT run inside nix; nix breaks xcodebuild. The project ad-hoc
      # signs by default (CODE_SIGN_IDENTITY=-), fine for a personal build.
      - name: Build Ghostty.app
        run: |
          cd macos
          xcodebuild -target Ghostty -configuration Release

      # Re-sign everything ad-hoc: the bundled Sparkle framework ships signed
      # by the Sparkle team; dyld refuses to load a framework whose Team ID
      # differs from the (ad-hoc) app, crashing at launch.
      - name: Ad-hoc re-sign bundle
        run: |
          APP=macos/build/Release/Ghostty.app
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
          codesign -f -s - "$SPARKLE/XPCServices/Downloader.xpc"
          codesign -f -s - "$SPARKLE/XPCServices/Installer.xpc"
          codesign -f -s - "$SPARKLE/Autoupdate"
          codesign -f -s - "$SPARKLE/Updater.app"
          codesign -f -s - "$APP/Contents/Frameworks/Sparkle.framework"
          for p in "$APP"/Contents/PlugIns/*.plugin; do [ -e "$p" ] && codesign -f -s - "$p"; done
          codesign -f -s - --entitlements macos/Ghostty.entitlements "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Zip App
        run: |
          cd macos/build/Release
          zip -9 -r --symlinks ../../../ghostty-fork-macos.zip Ghostty.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-fork-macos
          path: ghostty-fork-macos.zip
          retention-days: 30
